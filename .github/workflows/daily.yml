name: Daily India Impact Brief

# WHEN it runs:
on:
  schedule:
    - cron: "0 1 * * *"      # 01:00 UTC = 06:30 AM IST, every day
  workflow_dispatch: {}       # ...and a "Run" button you can press any time

# What the job is allowed to do (commit results + publish the web page).
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build the daily brief
        env:
          # These come from your repo's Settings > Secrets and variables > Actions.
          # Any that you leave unset simply disable that feature (all optional).
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python run.py

      - name: Save the brief back to the repo (your history)
        run: |
          git config user.name "news-finance-hub-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data site
          git commit -m "Daily brief $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git push || echo "nothing to push"

      - name: Package the web page for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
