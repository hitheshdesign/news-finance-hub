# =============================================================================
# FILTERS — the "ground rules" that keep the brief focused and noise-free.
# Tune these numbers to make the brief stricter (fewer, higher-signal items)
# or looser (more items). No coding needed — just change the values.
# =============================================================================

# An item must score at least this to survive. Higher = stricter.
min_relevance_score: 2.0

# Maximum number of events in a daily brief (after ranking).
max_events_per_brief: 8

# How many go in the "Top — what matters most" highlight band.
top_highlights: 3

# --- Variety: stop the brief being "all Fed / all gold" ---
# Cap how many cards can share the SAME matched pattern (e.g. two Fed stories),
# so distinct themes get a seat. Higher = allow more repeats of one theme.
max_per_topic: 2

# --- Cross-day de-duplication (don't re-post yesterday's story) ---
# How many recent days of briefs to compare today's stories against.
dedup_window_days: 5
# If a story overlaps a recent one by at least this much, DROP it as a repeat.
cross_day_similarity: 0.7
# If it overlaps in this looser band, KEEP it but flag it "Developing".
developing_similarity: 0.45

# --- Forward calendar ---
# Show calendar events falling within this many days ahead (the section is
# collapsed by default, so a long horizon costs no space on the page).
calendar_lookahead_days: 120
# The calendar is collapsed by default; if any event is within this many days,
# an alert badge appears on its header so you know to open it.
calendar_alert_days: 4

# Words that, if present, ADD to relevance (these touch India-transmission
# channels). Weighted: strong signals score higher.
relevance_keywords:
  strong:   # +2.0 each (core macro drivers)
    - fed
    - federal reserve
    - interest rate
    - rate hike
    - rate cut
    - inflation
    - cpi
    - crude
    - oil price
    - brent
    - gold
    - rupee
    - dollar
    - rbi
    - repo rate
    - tariff
    - sanctions
    - yield
    - opec
    # commodities & agri (so a sugar/edible-oil/metal move isn't dropped)
    - sugar
    - edible oil
    - palm oil
    - wheat
    - fertilizer
    - fertiliser
    - copper
    - aluminium
    - aluminum
  medium:   # +1.0 each (sectors / linked themes)
    - metals
    - steel
    - semiconductor
    - china
    - monsoon
    - fii
    - nifty
    - sensex
    - bond
    - gas
    - shipping
    - freight
    - trade war
    - export
    - import
    # softer commodity / food signals
    - cotton
    - soybean
    - soyabean
    - food inflation
    - food prices
    - export ban
    - urea
    - commodity
    - crop
  india_bonus: # +1.0 extra if any appear (direct India relevance)
    - india
    - indian
    - rupee
    - rbi
    - nifty
    - sensex
    - mumbai
    - sebi

# Words that mark low-value noise; if present, SUBTRACT from relevance.
noise_keywords:   # -1.5 each
    - celebrity
    - cricket
    - bollywood
    - horoscope
    - lottery
    - gadget review
    - recipe
    - astrology
    - box office

# Two items are treated as the SAME event (same day) if their headline+summary
# share at least this fraction of significant words. Lower = merges more
# aggressively (fewer near-duplicate cards).
cluster_similarity: 0.4
# ...but they must also share at least this many significant words, so two
# short headlines with one word in common don't get falsely merged.
cluster_min_shared: 2
