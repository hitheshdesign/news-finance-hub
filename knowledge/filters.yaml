# Words that mark low-value noise; if present, SUBTRACT from relevance.
noise_keywords:   # -1.5 each
    - celebrity
    - cricket
    - bollywood
    - horoscope
    - lottery
    - gadget review
    - recipe
    - astrology
    - box office

# Two items are treated as the SAME event (same day) if their headline+summary
# share at least this fraction of significant words. Lower = merges more
# aggressively (fewer near-duplicate cards).
cluster_similarity: 0.4
# ...but they must also share at least this many significant words, so two
# short headlines with one word in common don't get falsely merged.
cluster_min_shared: 2
