# =============================================================================
# GLOBAL MARKETS — curated country data for the Global Finance world map.
#
# INDICATIVE, EDUCATIONAL DATA — not live, not trading advice. Numbers are
# rounded, curated estimates meant to teach the SHAPE of each market, not to be
# traded on. Refresh CAPE periodically from a free source (Siblis Research).
#
# The fields follow the checklist a value investor runs before buying a whole
# country's index — written so a beginner can follow the reasoning:
#   1. What business am I actually buying?   economy, sectors
#   2. What am I paying for it?              cape_now vs cape_avg, cape_pct, pb, div_yield
#   3. What might I get back, in rupees?     er_* decomposition, currency_note
#   4. Are these good businesses?            roe, top10_weight
#   5. Can they take it from me?             rule_of_law
#   6. What breaks it / what lifts it?       downside, upside, worst_drawdown
#   7. Can I even buy it?                    access
#   8. So what?                              verdict, india_angle
#
# valuation: cheap | fair | expensive  -> drives the map colour
# sectors:   weights are approximate index weights, biggest first
# =============================================================================

