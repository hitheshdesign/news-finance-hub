# =============================================================================
# GLOBAL MARKETS — curated country data for the Global Finance world map.
#
# INDICATIVE, EDUCATIONAL DATA — not live, not trading advice. Numbers are
# rounded, curated estimates meant to teach the SHAPE of each market, not to
# be traded on. Refresh CAPE periodically from a free source (Siblis Research).
#
# The fields follow the checklist a value investor (think Munger/Buffett)
# runs before buying a whole country's index:
#   1. What am I paying?          cape_now vs cape_avg, cape_pct, pb, div_yield
#   2. What do I get back?        expected-return decomposition (er_*)
#   3. In MY currency?            er_inr, currency_note  <- crucial for an Indian
#   4. Is the business any good?  roe, top10_weight (concentration)
#   5. Can they take it from me?  rule_of_law, governance
#   6. What could go wrong?       risks, worst_drawdown, govt_debt_gdp
#   7. Which way is the wind?     tailwinds / headwinds / demographics
#   8. Can I even buy it?         access
#   9. So what?                   verdict, india_angle
#
# valuation: cheap | fair | expensive  -> drives the map colour
# =============================================================================

