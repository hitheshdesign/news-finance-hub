# =============================================================================
# GLOSSARY — plain-English definitions for finance jargon.
# Any term here is auto-underlined in the brief; hovering or tapping it shows
# the definition. This lets the analysis stay short while never leaving a
# beginner stuck on a word. Add your own terms freely.
# =============================================================================

terms:
  FII: "Foreign Institutional Investors — big overseas funds that buy and sell Indian shares. When they pull money out, markets and the rupee usually fall."
  FIIs: "Foreign Institutional Investors — big overseas funds that buy and sell Indian shares. When they pull money out, markets and the rupee usually fall."
  CAD: "Current Account Deficit — when India spends more foreign currency on imports than it earns from exports. A wider gap tends to weaken the rupee."
  current account deficit: "When India spends more foreign currency on imports than it earns from exports. A wider gap tends to weaken the rupee."
  repo rate: "The interest rate at which the RBI lends to banks. When it rises, loans (home, car, business) get costlier; when it falls, they get cheaper."
  CPI: "Consumer Price Index — the main measure of inflation, i.e. how fast everyday prices are rising."
  inflation: "How fast the general price of everyday goods and services is rising. High inflation eats into your money's value."
  RBI: "Reserve Bank of India — India's central bank. It sets interest rates and works to keep inflation and the rupee stable."
  Fed: "The US Federal Reserve — America's central bank. Its interest-rate decisions ripple across global markets, including India."
  Federal Reserve: "America's central bank. Its interest-rate decisions ripple across global markets, including India."
  yields: "The return investors earn on bonds. Rising yields often pull money away from stocks and gold."
  bond yields: "The return investors earn on bonds. Rising yields often pull money away from stocks and gold."
  OMCs: "Oil Marketing Companies — firms like HPCL, BPCL and IOC that refine and sell fuel. Their profits get squeezed when crude oil is costly but pump prices are held down."
  hawkish: "Central-bank speak for leaning toward HIGHER interest rates to fight inflation. Usually a headwind for stocks."
  dovish: "Central-bank speak for leaning toward LOWER interest rates to support growth. Usually a tailwind for stocks."
  safe haven: "An asset (like gold or the US dollar) investors rush into when they are scared, because it tends to hold its value in a crisis."
  OPEC: "A group of major oil-producing nations that coordinate how much crude oil to pump, strongly influencing global oil prices."
  monsoon: "India's June–September rainy season. Good rains lift farm output and rural incomes; a weak monsoon can push up food prices."
  NBFCs: "Non-Banking Financial Companies — lenders that give loans like banks but aren't banks (e.g. gold-loan or vehicle-loan firms). They're sensitive to interest-rate moves."
  fiscal deficit: "The gap between what the government spends and what it earns. A large gap can worry investors and pressure the rupee."
  crude oil: "Unrefined oil — the raw material for petrol, diesel and many products. India imports most of what it uses, so its price hits inflation and the rupee."
  import bill: "The total amount of foreign currency India pays for its imports (oil, gold, electronics). A bigger bill pressures the rupee."
  rate-sensitive: "Businesses whose sales depend heavily on loans — like housing, cars and lenders — so they rise and fall with interest rates."
