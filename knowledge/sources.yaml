# REMOVED, and why — so nobody re-adds them by accident:
#   Reuters Business / Reuters Markets — feeds.reuters.com no longer resolves;
#     Reuters retired its public RSS. Was silently contributing nothing.
#   Moneycontrol Business — feed still responds but its newest item is from
#     April 2024. A stale feed is worse than no feed.
#   PIB (Press Information Bureau) — the English endpoints return empty; only
#     the Hindi feed has content. Worth revisiting if they fix it, since it is
#     the Indian government speaking directly (tier 1).
#   IMF / World Bank / BIS / OECD / PIIE / VoxEU — all 403 or 404 to a script.
#     Their analysis would be ideal tier-1/2 material; no free RSS available.

# --- GDELT (global events firehose, free, no API key) ---
# Broadened well beyond rates-and-gold: the point is to catch the CAUSE of a
# market move — a policy, a shortage, a drought, a shipping route closing —
# rather than only its price.
gdelt:
  enabled: true
  query_terms:
    # monetary & macro
    - "central bank"
    - "interest rate"
    - "inflation"
    # policy & regulation — decisions that change the rules of the game
    - "trade policy"
    - "export ban"
    - "import duty"
    - "tariff"
    - "sanctions"
    - "subsidy"
    - "industrial policy"
    - "free trade agreement"
    - "antitrust"
    - "capital controls"
    # geopolitics with a supply-chain edge
    - "supply chain"
    - "rare earths"
    - "semiconductor export"
    - "shipping route"
    - "red sea shipping"
    - "strait of hormuz"
    - "port congestion"
    # nature & agriculture — the real driver of Indian food inflation
    - "monsoon"
    - "el nino"
    - "la nina"
    - "drought"
    - "heatwave"
    - "crop failure"
    - "food prices"
    - "wheat prices"
    - "sugar prices"
    - "edible oil"
    - "palm oil"
    - "fertilizer"
    # energy & materials
    - "crude oil"
    - "opec"
    - "natural gas"
    - "copper prices"
    - "lithium"
    - "critical minerals"
    - "power shortage"
    # India-specific structural
    - "india manufacturing"
    - "india exports"
    - "reserve bank of india"
  timespan: "1d"
  max_records: 120
  language: "english"
  # GDELT answers a long OR-query with a 429, so the terms above are requested
  # in batches of this size with a short pause between them.
  batch_size: 10
  batch_pause_seconds: 2.0

# --- FRED (US macro data series, free API key needed) ---
# Optional context signals. Skipped automatically if no FRED_API_KEY is set.
fred:
  enabled: true
  series:
    - {id: "FEDFUNDS",   label: "US Fed Funds Rate (%)"}
    - {id: "CPIAUCSL",   label: "US CPI (index)"}
    - {id: "UNRATE",     label: "US Unemployment Rate (%)"}
    - {id: "DGS10",      label: "US 10-Year Treasury Yield (%)"}
    - {id: "DTWEXBGS",   label: "US Dollar Index (broad)"}
