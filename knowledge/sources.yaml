# =============================================================================
# SOURCES — where the raw news comes from (all free RSS, no keys).
#
# Every feed here was checked live before being added. Two fields do real work
# in the pipeline, so fill them in when you add a feed:
#
#   tier   1 = PRIMARY. The institution itself speaking — a central bank, a
#              regulator, a treaty body. Nothing is second-hand, so this is the
#              highest-legitimacy material there is. Scored up hard.
#          2 = ANALYSIS. Outlets whose business is explaining rather than
#              breaking — think tanks, research desks, long-form journalism.
#              Slower, deeper, far less likely to be noise.
#          3 = WIRE. Mainstream business press. Fast and useful for knowing
#              WHAT happened, but this is also where the daily price-tick
#              churn lives ("Sensex up 200 pts"), so it earns no bonus and
#              gets filtered hard by the noise rules in filters.yaml.
#
#   topic  Drives the variety quota in run.py, so the brief spans several
#          themes instead of five versions of the same rate story. Use one of:
#          policy · geopolitics · climate · energy · trade · technology ·
#          economy · markets · india_depth
#
# max_items (optional) caps how many headlines we take from one feed per run.
# High-volume wires get a smaller cap so they cannot crowd out the slow,
# thoughtful sources purely by publishing more.
# =============================================================================

rss_feeds:

  # ---------------------------------------------------------------- TIER 1
  # Primary sources. The institution's own words, before anyone interprets it.
  - name: "US Federal Reserve"
    url: "https://www.federalreserve.gov/feeds/press_all.xml"
