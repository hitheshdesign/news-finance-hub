# --- GDELT (global events firehose, free, no API key) ---
# We query recent English articles matching macro/market themes.
gdelt:
  enabled: true
  # Themes/keywords OR-joined into the GDELT query. Kept focused to cut noise.
  query_terms:
    - "federal reserve"
    - "interest rate"
    - "inflation"
    - "crude oil"
    - "gold price"
    - "rupee"
    - "sanctions"
    - "tariff"
    - "central bank"
    # commodities & agriculture — so the CAUSE of a commodity move (weather,
    # export bans, supply shocks) is actually fetched, not just its price
    - "sugar prices"
    - "edible oil"
    - "palm oil"
    - "wheat prices"
    - "food prices"
    - "export ban"
    - "fertilizer"
    - "copper prices"
    - "aluminium"
    - "natural gas"
  timespan: "1d"        # look back 1 day
  max_records: 80
  language: "english"

# --- FRED (US macro data series, free API key needed) ---
# Optional context signals. Skipped automatically if no FRED_API_KEY is set.
fred:
  enabled: true
  series:
    - {id: "FEDFUNDS",   label: "US Fed Funds Rate (%)"}
    - {id: "CPIAUCSL",   label: "US CPI (index)"}
    - {id: "UNRATE",     label: "US Unemployment Rate (%)"}
    - {id: "DGS10",      label: "US 10-Year Treasury Yield (%)"}
    - {id: "DTWEXBGS",   label: "US Dollar Index (broad)"}
